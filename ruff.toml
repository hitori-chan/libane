# libane's Python: ruff format; ruff check
line-length = 100
target-version = "py310"

[lint]
select = ["E", "W", "F", "B", "UP", "SIM", "RUF", "I", "N", "PL", "C4", "PIE", "RET", "PTH", "A", "ISC", "PERF"]
# the module speaks in os.path and plain open(): ctypes wants str paths
ignore = ["PTH", "PLR0913", "PLR2004", "PLW0603"]
